[package]
name = "skycompress"
version = "0.1.0"
edition = "2021"
authors = ["Novitak Team"]
description = "Image compression library with byte-limit targeting using binary search optimization"
license = "MIT"
repository = "https://github.com/novitai/skycompress"
keywords = ["image", "compression", "jpeg", "webp", "optimization"]
categories = ["multimedia::images"]

[lib]
name = "skycompress"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "skycompress"
path = "src/bin/cli.rs"
required-features = ["cli"]

[dependencies]
image = { version = "0.25", features = ["jpeg", "webp"], optional = true }
opencv = { version = "0.97", default-features = false, features = ["imgcodecs", "imgproc"], optional = true }
thiserror = "1.0"
tracing = "0.1"
clap = { version = "4.5", features = ["derive"], optional = true }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
rayon = "1.8"
crossbeam = "0.8"
bumpalo = "3.14"
memmap2 = "0.9"
ahash = "0.8"
once_cell = "1.19"

[features]
default = ["image-backend", "cli"]
opencv-backend = ["opencv"]
image-backend = ["image"]
cli = ["clap", "image-backend", "tracing-subscriber"]
python = ["pyo3", "image-backend"]

[dev-dependencies]
criterion = "0.5"
tracing-subscriber = "0.3"
rand = "0.8"

[profile.release]
lto = "fat"  # Full LTO across all crates
codegen-units = 1  # Single codegen unit for max optimization
opt-level = 3
strip = true  # Strip symbols for smaller binary
