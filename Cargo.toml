[package]
name = "skycompress"
version = "0.1.0"
edition = "2021"
authors = ["Novitak Team"]
description = "Image compression library with byte-limit targeting using binary search optimization"
license = "MIT"
repository = "https://github.com/novitai/skycompress"
keywords = ["image", "compression", "jpeg", "webp", "optimization"]
categories = ["multimedia::images"]

[dependencies]
image = { version = "0.25", features = ["jpeg", "webp"], optional = true }
opencv = { version = "0.97", default-features = false, features = ["imgcodecs", "imgproc"], optional = true }
thiserror = "1.0"
tracing = "0.1"

[features]
default = ["image-backend"]
opencv-backend = ["opencv"]
image-backend = ["image"]

[dev-dependencies]
criterion = "0.5"
tracing-subscriber = "0.3"
